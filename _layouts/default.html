<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2d3748;
      background-color: #f7fafc;
      line-height: 1.6;
    }

    header {
      background-color: #276749;
      color: #fff;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.85;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    .services {
      margin-top: 1rem;
    }

    .services h2 {
      font-size: 1.6rem;
      color: #276749;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .service-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      list-style: none;
    }

    .service-list li {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      text-align: center;
      flex: 1 1 180px;
      max-width: 220px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .service-list li .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.6rem;
    }

    .service-list li strong {
      display: block;
      font-size: 1.05rem;
      color: #276749;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.875rem;
      color: #718096;
      border-top: 1px solid #e2e8f0;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  {{ content }}
  <footer>
    &copy; <span id="year"></span> Ground Control Mowing
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  </footer>
</body>
</html>
